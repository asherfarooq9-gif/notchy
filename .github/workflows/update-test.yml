name: Update test

# Installs an older release, then updates it the way the app does (the installer is started with --updated --force-run while the
# old app is running), and records what happens to the Start menu shortcut and to any error window. It also checks how the app
# was started afterwards: the installer starts it with an --updated flag when its launch worked.
# "to" is a release tag, or "build" to build the installer from the checked-out code and update to that.
# Fails if a shortcut error appears, the shortcut disappears, or (for "build") the app was not started by the installer.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Release tag installed first (for example v0.2.1)
        required: true
      to:
        description: Release tag to update to (for example v0.2.2), or "build" for this checkout
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FROM_TAG: ${{ inputs.from }}
      TO_TAG: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the old installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'from'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:FROM_TAG --repo "$env:GITHUB_REPOSITORY" --pattern 'Notchy-Setup-*.exe' --dir $dir
          Write-Host "from: $((Get-ChildItem $dir -Filter 'Notchy-Setup-*.exe').Name)"

      - name: Get the new installer from a release
        if: ${{ inputs.to != 'build' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'to'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:TO_TAG --repo "$env:GITHUB_REPOSITORY" --pattern 'Notchy-Setup-*.exe' --dir $dir
          Write-Host "to: $((Get-ChildItem $dir -Filter 'Notchy-Setup-*.exe').Name)"

      - uses: actions/setup-node@v4
        if: ${{ inputs.to == 'build' }}
        with:
          node-version: 22
          cache: npm

      - name: Build the new installer from this code
        if: ${{ inputs.to == 'build' }}
        shell: pwsh
        run: |
          npm ci
          npm run dist
          $dir = Join-Path $env:RUNNER_TEMP 'to'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item release\Notchy-Setup-*.exe $dir
          Write-Host "to: $((Get-ChildItem $dir -Filter 'Notchy-Setup-*.exe').Name) (built here)"

      - name: Install the old version like a double-click
        shell: pwsh
        run: |
          $exe = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'from') -Filter 'Notchy-Setup-*.exe').FullName
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'The old installer is still running after 5 minutes.' }
          if ($p.ExitCode -ne 0) { throw "The old installer failed with exit code $($p.ExitCode)." }
          Start-Sleep -Seconds 20
          $count = @(Get-Process -Name Notchy -ErrorAction SilentlyContinue).Count
          Write-Host "Old version running: $count programs"
          if ($count -eq 0) { throw 'The old version did not stay running, so an update while it runs cannot be tested.' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Notchy.lnk")) { throw 'The old install has no Start menu shortcut.' }

      - name: Update the way the app does, and watch
        shell: pwsh
        run: |
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Notchy.lnk"
          $log = Join-Path $env:RUNNER_TEMP 'update-timeline.txt'
          $watcher = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "$env:GITHUB_WORKSPACE\.github\scripts\watch-update.ps1", '-Shortcut', "`"$lnk`"", '-LogFile', "`"$log`"", '-Seconds', '75' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $new = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'to') -Filter 'Notchy-Setup-*.exe').FullName
          # What electron-updater runs when "Restart and update" is pressed.
          $installer = Start-Process -FilePath $new -ArgumentList '--updated', '--force-run' -PassThru
          Start-Sleep -Seconds 1
          Get-Process -Name Notchy -ErrorAction SilentlyContinue | Stop-Process -Force # the app quits as the installer starts
          if (-not $installer.WaitForExit(300000)) { throw 'The new installer is still running after 5 minutes.' }
          Write-Host "New installer exit code: $($installer.ExitCode)"
          $watcher.WaitForExit(120000) | Out-Null
          Write-Host '----- timeline -----'
          Get-Content $log
          Write-Host '--------------------'
          $text = Get-Content $log -Raw
          $main = Get-CimInstance Win32_Process -Filter "Name='Notchy.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | Select-Object -First 1
          $startedWith = if ($main) { ($main.CommandLine -replace '^"[^"]+"\s*', '').Trim() } else { '(not running)' }
          Write-Host "How the running app was started - arguments: [$startedWith]"
          $problems = @()
          if ($text -match 'WINDOW: .*(\.lnk|cannot find)') { $problems += 'A window mentioning the shortcut appeared (the "Windows cannot find" error).' }
          if ($text -match 'shortcut exists = False') { $problems += 'The Start menu shortcut was missing at some moment.' }
          if ($installer.ExitCode -ne 0) { $problems += "The new installer exited with code $($installer.ExitCode)." }
          if (-not $main) { $problems += 'The app was not running after the update (the installer should start it again).' }
          elseif ($env:TO_TAG -eq 'build' -and $startedWith -notmatch '--updated') { $problems += 'The app was running, but the installer did not start it (no --updated flag).' }
          $shown = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like 'Notchy*' }).DisplayVersion
          Write-Host "Version in the Apps list: $shown"
          if ($problems.Count -gt 0) { $problems | ForEach-Object { Write-Host "::error::$_" }; throw 'The update test found problems.' }
          Write-Host 'The update went through with no shortcut problem.'
